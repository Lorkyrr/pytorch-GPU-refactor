# Values reais do chart gha-runner-scale-set (Actions Runner Controller)
# usadas para subir o runner "arc-runner-set-gpu". Mantido em sincronia
# manual com ~/gpu-runner-values.yaml no host (esse arquivo é aplicado
# lá, não a partir do repo):
#
#   helm upgrade --install arc-runner-set-gpu \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#     -n arc-runners -f gpu-runner-values.yaml
#
# `resources.limits.nvidia.com/gpu: 1` faz o scheduler do Kubernetes
# reservar de verdade a RTX 3050 pra este pod (via
# nvidia-device-plugin.yaml, o DaemonSet oficial da NVIDIA aplicado com
# kubectl — sem GPU Operator/Helm).
#
# Sem Docker aqui: nada de socket do host montado. A imagem do runner
# (ver runner-image/Dockerfile) já traz Python + PyTorch/CUDA, e os
# workflows chamam `python3 main.py ...` direto — o processo roda dentro
# deste mesmo pod, que é o que de fato reservou a GPU. Isso fecha a
# lacuna que existia antes (treino rodando via socket do Docker do host,
# fora do agendamento do Kubernetes).
githubConfigUrl: "https://github.com/Lorkyrr/pytorch-gpu-sandbox"
githubConfigSecret: pre-defined-secret

template:
  spec:
    containers:
      - name: runner
        # TODO: build + push k8s/runner-image/Dockerfile e trocar aqui.
        image: <seu-registry>/pytorch-gpu-sandbox-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          limits:
            nvidia.com/gpu: 1
