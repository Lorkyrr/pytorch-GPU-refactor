name: Teste GPU

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: arc-runner-set-gpu
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Sem Docker: o nvidia-container-runtime do node injeta o driver e o
      # próprio binário nvidia-smi direto no container do runner sempre
      # que o pod pede nvidia.com/gpu (ver k8s/gpu-runner-values.yaml).
      - name: Testar acesso à GPU
        run: nvidia-smi

