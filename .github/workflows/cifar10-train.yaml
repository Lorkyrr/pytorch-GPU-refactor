name: CIFAR-10 - Treinar ResNet-20

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Número de épocas de treino"
        required: false
        default: "30"
      batch_size:
        description: "Tamanho do lote"
        required: false
        default: "128"
      lr:
        description: "Taxa de aprendizado inicial"
        required: false
        default: "0.1"

concurrency:
  group: gpu-runner
  cancel-in-progress: false

jobs:
  treinar:
    runs-on: arc-runner-set-gpu
    timeout-minutes: 120
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Cache do dataset CIFAR-10
        uses: actions/cache@v4
        with:
          path: data
          key: cifar10-dataset-v1

      - name: Build da imagem Docker
        run: docker build -t pytorch-cifar10:${{ github.sha }} .

      - name: Treinar ResNet-20 no CIFAR-10
        env:
          CONTAINER: treino-${{ github.run_id }}
        run: |
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker run --gpus all \
            -e PYTHONUNBUFFERED=1 \
            --name "$CONTAINER" \
            pytorch-cifar10:${{ github.sha }} \
            python3 main.py train \
              --epochs ${{ inputs.epochs }} \
              --batch-size ${{ inputs.batch_size }} \
              --lr ${{ inputs.lr }}

      - name: Extrair checkpoint e dataset do container
        if: always()
        env:
          CONTAINER: treino-${{ github.run_id }}
        run: |
          docker cp "$CONTAINER":/app/resnet20_cifar10.pth ./resnet20_cifar10.pth || true
          rm -rf data
          docker cp "$CONTAINER":/app/data ./data || true
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

      - name: Upload do checkpoint treinado
        uses: actions/upload-artifact@v4
        with:
          name: resnet20-cifar10-checkpoint
          path: resnet20_cifar10.pth
          if-no-files-found: warn
