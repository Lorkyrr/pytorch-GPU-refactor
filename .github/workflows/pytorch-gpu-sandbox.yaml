name: PyTorch GPU Sandbox CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-cpu-fallback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyTorch and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          # Instala versão CPU do PyTorch para execução leve no GitHub Actions
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Lint code with flake8
        run: |
          # Para a execução se houver erros de sintaxe ou variáveis não definidas
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Alertas de complexidade e estilo (não interrompem o build)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Benchmark mode (CPU fallback validation)
        run: |
          python main.py benchmark