name: PyTorch GPU (CIFAR-10) - Docker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de execução"
        required: true
        default: "benchmark"
        type: choice
        options:
          - benchmark
          - train
      epochs:
        description: "Número de épocas (somente no modo train)"
        required: false
        default: "30"
      batch_size:
        description: "Tamanho do lote (somente no modo train)"
        required: false
        default: "128"
      lr:
        description: "Taxa de aprendizado inicial (somente no modo train)"
        required: false
        default: "0.1"

concurrency:
  group: gpu-runner
  cancel-in-progress: false

jobs:
  run:
    # Roda no runner self-hosted (ARC) com a RTX 3050 real alocada via
    # Kubernetes device plugin (nvidia.com/gpu) — ver k8s/. Nada aqui
    # depende de runner hospedado pela GitHub.
    #
    # PRECISA do socket do Docker montado no pod (ver
    # k8s/gpu-runner-values.docker.yaml) — a imagem do runner usada por
    # pytorch-gpu-python.yaml (k8s/runner-image/) não tem `docker` CLI
    # nem o socket, então este workflow só funciona enquanto o cluster
    # estiver com k8s/gpu-runner-values.docker.yaml aplicado, não com
    # k8s/gpu-runner-values.yaml (a versão nativa em Python, que é a
    # aplicada por padrão neste repo).
    runs-on: arc-runner-set-gpu
    timeout-minutes: 120
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Cache do dataset CIFAR-10
        if: github.event.inputs.mode == 'train'
        uses: actions/cache@v4
        with:
          path: data
          key: cifar10-dataset-v1

      - name: Build da imagem Docker
        run: docker build -t pytorch-cifar10:${{ github.sha }} .

      - name: Rodar benchmark de GPU/cuDNN/cuBLAS
        if: github.event.inputs.mode == 'benchmark'
        run: |
          docker run --rm --gpus all \
            -e PYTHONUNBUFFERED=1 \
            pytorch-cifar10:${{ github.sha }} \
            python3 main.py benchmark

      - name: Treinar ResNet-20 no CIFAR-10
        if: github.event.inputs.mode == 'train'
        env:
          CONTAINER: treino-${{ github.run_id }}
        run: |
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker run --gpus all \
            -e PYTHONUNBUFFERED=1 \
            --name "$CONTAINER" \
            pytorch-cifar10:${{ github.sha }} \
            python3 main.py train \
              --epochs ${{ github.event.inputs.epochs }} \
              --batch-size ${{ github.event.inputs.batch_size }} \
              --lr ${{ github.event.inputs.lr }}

      # Sem bind mount de propósito: o daemon Docker deste runner não
      # compartilha filesystem com o pod (setup DinD/socket via k8s), então
      # -v ${{ github.workspace }}:/app sobrescreveria /app vazio por cima
      # do que o build copiou. docker cp funciona via API, não depende disso.
      - name: Extrair checkpoint e dataset do container
        if: always() && github.event.inputs.mode == 'train'
        env:
          CONTAINER: treino-${{ github.run_id }}
        run: |
          docker cp "$CONTAINER":/app/resnet20_cifar10.pth ./resnet20_cifar10.pth || true
          rm -rf data
          docker cp "$CONTAINER":/app/data ./data || true
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

      - name: Upload do checkpoint treinado
        if: github.event.inputs.mode == 'train'
        uses: actions/upload-artifact@v4
        with:
          name: resnet20-cifar10-checkpoint
          path: resnet20_cifar10.pth
          if-no-files-found: warn

      - name: Limpar imagem Docker
        if: always()
        run: docker rmi pytorch-cifar10:${{ github.sha }} || true
