name: PyTorch GPU (CIFAR-10) - Python

on:
  # Removido o gatilho de push: na banda larga real desta máquina, o
  # download do torch+deps CUDA (varios wheels, um só já passa de 500 MB)
  # caiu no meio e ficou preso ~30min tentando retomar — disparar isso a
  # cada commit é inviável até k8s/runner-image/Dockerfile existir de
  # verdade (ver TODO em k8s/gpu-runner-values.yaml). Só manual por ora.
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de execução"
        required: true
        default: "benchmark"
        type: choice
        options:
          - benchmark
          - train
      epochs:
        description: "Número de épocas (somente no modo train)"
        required: false
        default: "30"
      batch_size:
        description: "Tamanho do lote (somente no modo train)"
        required: false
        default: "128"
      lr:
        description: "Taxa de aprendizado inicial (somente no modo train)"
        required: false
        default: "0.1"
      architecture:
        description: "Variante da ResNet (somente no modo train)"
        required: false
        default: "resnet20"
        type: choice
        options:
          - resnet20
          - resnet56
          - resnet110
      use_amp:
        description: "Usar precisão mista (AMP) no treino"
        required: false
        default: true
        type: boolean
      seed:
        description: "Semente para reprodutibilidade (vazio = aleatório)"
        required: false
        default: ""

concurrency:
  group: gpu-runner
  cancel-in-progress: false

jobs:
  run:
    # Roda no runner self-hosted (ARC) com a RTX 3050 real alocada via
    # Kubernetes device plugin (nvidia.com/gpu) — ver k8s/. Sem Docker:
    # python3 roda direto dentro deste pod, que é quem reservou a GPU.
    runs-on: arc-runner-set-gpu
    timeout-minutes: 120
    env:
      # push não tem inputs (só workflow_dispatch tem) — cai pra benchmark.
      MODE: ${{ github.event.inputs.mode || 'benchmark' }}
      CHECKPOINT_FILE: ${{ format('{0}_cifar10.pth', github.event.inputs.architecture || 'resnet20') }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Cache de pacotes pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Enquanto k8s/runner-image/Dockerfile não é publicado (ver TODO em
      # k8s/gpu-runner-values.yaml), o pod ainda sobe com a imagem padrão
      # do runner, sem PyTorch — daí o "ModuleNotFoundError: No module
      # named 'torch'". O python3 dessa imagem (base Debian/Ubuntu) nem
      # tem pip embutido ("No module named pip": Debian/Ubuntu removem o
      # ensurepip do pacote python3 de propósito), e não temos mais root
      # pra instalar via apt (sem runAsUser: 0 no values.yaml) — por isso
      # o bootstrap via get-pip.py oficial do PyPA, em modo --user. O pip
      # resultante ainda bloqueia por PEP 668 ("externally-managed-
      # environment", Python 3.12 marca o sistema como gerenciado pelo
      # apt) — --break-system-packages é seguro aqui porque o pod inteiro
      # é descartado a cada job, não é um sistema persistente pra quebrar.
      - name: Instalar dependências Python
        run: |
          curl -sS https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
          python3 /tmp/get-pip.py --user --break-system-packages
          python3 -m pip install --user --break-system-packages -r requirements.txt
          python3 -m pip install --user --break-system-packages -r requirements-dev.txt

      # Gate rápido antes de gastar tempo da única GPU física: se a suíte
      # de testes (que aqui já roda com torch instalado, diferente do
      # runner hospedado em validacao-repositorio.yaml) falhar, nem chega
      # a rodar benchmark/treino.
      - name: Testes unitários (com torch, inclui ResNet/AMP)
        run: python3 -m pytest -v

      - name: Cache do dataset CIFAR-10
        if: env.MODE == 'train'
        uses: actions/cache@v4
        with:
          path: data
          key: cifar10-dataset-v1

      - name: Rodar benchmark de GPU/cuDNN/cuBLAS
        if: env.MODE == 'benchmark'
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 main.py benchmark

      - name: Treinar ResNet no CIFAR-10
        if: env.MODE == 'train'
        env:
          PYTHONUNBUFFERED: "1"
          EPOCHS: ${{ github.event.inputs.epochs }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          LR: ${{ github.event.inputs.lr }}
          ARCHITECTURE: ${{ github.event.inputs.architecture || 'resnet20' }}
          USE_AMP: ${{ github.event.inputs.use_amp || 'true' }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          args=(--epochs "$EPOCHS" --batch-size "$BATCH_SIZE" --lr "$LR" --arquitetura "$ARCHITECTURE")
          if [ "$USE_AMP" = "false" ]; then
            args+=(--sem-amp)
          fi
          if [ -n "$SEED" ]; then
            args+=(--seed "$SEED")
          fi
          python3 main.py train "${args[@]}"

      - name: Upload do checkpoint treinado
        if: env.MODE == 'train'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.architecture || 'resnet20' }}-cifar10-checkpoint
          path: ${{ env.CHECKPOINT_FILE }}
          if-no-files-found: warn
