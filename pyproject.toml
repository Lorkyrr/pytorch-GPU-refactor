[project]
name = "pytorch-gpu-sandbox"
version = "0.1.0"
description = "Sandbox de aprendizado de PyTorch + GPU/CUDA: benchmark de ambiente e treino de ResNet no CIFAR-10"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
